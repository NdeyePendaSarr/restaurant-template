name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne se connecte pas à la base
          # (page admin dynamique, client Drizzle en init paresseuse), mais on
          # fournit les variables pour un build parfaitement déterministe.
          DATABASE_URL: "postgresql://user:pass@localhost/db"
          ADMIN_PASSWORD: "ci-placeholder"
          AUTH_SECRET: "ci-placeholder-secret-key-32-characters"
